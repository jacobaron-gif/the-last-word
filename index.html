<body>
<div id="app">
  <div id="stage">
    <canvas id="art" aria-hidden="true"></canvas>
    <h1 id="loc-title"></h1>
  </div>
  <div id="lower">
    <main id="panel">
      <div id="desc" class="prose"></div>
      <div id="acts" class="btns"></div>
      <div id="exits" class="btns exits"></div>
    </main>
    <section id="sheet" hidden aria-live="polite">
      <div id="sheet-body"></div>
      <div id="sheet-foot"><button id="sheet-close" class="btn primary">Done</button></div>
    </section>
  </div>
  <nav id="bar">
    <button id="btn-notebook" class="barbtn"><span class="ico">✎</span> Notebook <span id="nb-dot" hidden></span></button>
    <button id="btn-menu" class="barbtn" aria-label="Menu">⋯</button>
  </nav>
</div>
<div id="overlay" hidden></div>
<noscript><p style="padding:2em;color:#eee">This game needs JavaScript.</p></noscript>
<script src="content.js?v=1"></script>
<script src="engine.js?v=1"></script>
<script src="save.js?v=1"></script>
<script src="art.js?v=1"></script>
